name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version into info.plist
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'EOF'
          import plistlib, sys
          path = "info.plist"
          with open(path, "rb") as f:
              data = plistlib.load(f)
          data["version"] = sys.argv[1]
          with open(path, "wb") as f:
              plistlib.dump(data, f)
          EOF

      - name: Build .alfredworkflow
        run: |
          chmod +x sbs.sh
          zip -X -r "$RUNNER_TEMP/alfred-video-side-by-side.alfredworkflow" info.plist sbs.sh sbs.lua icon.png README.md
          unzip -l "$RUNNER_TEMP/alfred-video-side-by-side.alfredworkflow"
          unzip -l "$RUNNER_TEMP/alfred-video-side-by-side.alfredworkflow" | grep -q " info.plist$"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/alfred-video-side-by-side.alfredworkflow" --generate-notes
